<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StreamVue · Live TV World</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0c10;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      color: #f0f2f5;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #1e1f24; }
    ::-webkit-scrollbar-thumb { background: #ff3b4a; border-radius: 10px; }
    .app { max-width: 1400px; margin: 0 auto; padding: 0 20px 90px 20px; }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 28px;
    }
    .logo-area { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .tv-name {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FF5E62 0%, #FF9966 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .tv-badge {
      background: #ff3b4a20;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #ff9f7c;
      border: 1px solid #ff5e6220;
    }
    .menu-links {
      display: flex;
      gap: 28px;
      background: #121317;
      padding: 6px 18px;
      border-radius: 60px;
    }
    .menu-links a {
      color: #ddd;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .menu-links a:hover, .menu-links a.active { color: #ff7340; }
    .search-refresh {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #111215;
      padding: 5px 5px 5px 18px;
      border-radius: 48px;
      border: 1px solid #2c2e36;
    }
    .search-box { display: flex; align-items: center; gap: 10px; }
    .search-box i { color: #ff8c5a; }
    .search-box input {
      background: transparent;
      border: none;
      padding: 8px 0;
      color: white;
      font-size: 0.9rem;
      width: 220px;
      outline: none;
    }
    .search-box input::placeholder { color: #6b6e7c; }
    .refresh-btn {
      background: #2a2c34;
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
    }
    .refresh-btn:hover { background: #ff5e62; transform: rotate(30deg); }
    .categories-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 28px 0 20px;
      border-bottom: 1px solid #20222a;
      padding-bottom: 12px;
    }
    .category-chip {
      background: transparent;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: #b0b3c0;
      border: 1px solid #2a2c34;
      transition: all 0.2s;
    }
    .category-chip i { margin-right: 8px; }
    .category-chip.active {
      background: #ff3b4a;
      color: white;
      border-color: #ff3b4a;
    }
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 12px;
      margin-bottom: 40px;
    }
    .channel-card {
      background: #111317;
      border-radius: 20px;
      padding: 14px;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid #23252e;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .channel-card:hover {
      transform: translateY(-3px);
      background: #1a1d26;
      border-color: #ff7340;
    }
    .channel-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #252a36, #181c24);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: #ff8c5a;
      flex-shrink: 0;
    }
    .channel-info { flex: 1; min-width: 0; }
    .channel-info h4 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-info span {
      font-size: 0.7rem;
      color: #8f92a0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .live-highlight {
      background: linear-gradient(95deg, #1b1e2a, #0f1119);
      border-radius: 24px;
      margin: 16px 0 20px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      border-left: 6px solid #ff3b4a;
    }
    .highlight-text h3 { font-size: 1.2rem; font-weight: 700; }
    .highlight-text p { color: #bcbfd0; font-size: 0.85rem; margin-top: 6px; }
    .live-badge {
      background: #ff3b4a;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0e0f14e6;
      backdrop-filter: blur(20px);
      border-top: 1px solid #2c2f3a;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 20px 22px;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      color: #a0a2b0;
      transition: 0.2s;
    }
    .nav-item i { font-size: 1.5rem; }
    .nav-item.active, .nav-item:hover { color: #ff7340; transform: translateY(-2px); }
    .empty-msg { text-align: center; padding: 50px; color: #7b7e8c; }
    /* ভিডিও প্লেয়ার মোডাল */
    .player-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000e6;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }
    .player-modal.active { display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .player-container {
      width: 90%;
      max-width: 1000px;
      background: black;
      border-radius: 20px;
      overflow: hidden;
    }
    .player-header {
      background: #1a1d26;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-player {
      background: #ff3b4a;
      border: none;
      color: white;
      padding: 6px 15px;
      border-radius: 30px;
      cursor: pointer;
    }
    video { width: 100%; max-height: 70vh; }
    @media (max-width: 700px) {
      .app { padding: 0 14px 90px; }
      .top-bar { flex-direction: column; align-items: stretch; }
      .channels-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="logo-area">
      <span class="tv-name"><i class="fas fa-tv"></i> StreamVue</span>
      <span class="tv-badge">LIVE · 500+ CH</span>
    </div>
    <div class="menu-links">
      <a href="#" class="active"><i class="fas fa-home"></i> Home</a>
      <a href="#"><i class="fas fa-fire"></i> Trending</a>
      <a href="#"><i class="fas fa-star"></i> Favorites</a>
    </div>
    <div class="search-refresh">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search channels...">
      </div>
      <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
    </div>
  </div>

  <div class="live-highlight" id="highlightBanner">
    <div class="highlight-text">
      <h3><i class="fas fa-futbol"></i> 🔴 LIVE: FIFA World Cup · T Sports HD</h3>
      <p>Vitality T20 Blast 2025 · Premier League · LaLiga</p>
    </div>
    <div class="live-badge"><i class="fas fa-circle" style="font-size: 0.6rem;"></i> 12 LIVE EVENTS</div>
  </div>

  <div class="categories-wrapper" id="categoryList"></div>
  <div id="channelsContainer" class="channels-grid"></div>
</div>

<!-- ভিডিও প্লেয়ার মোডাল -->
<div id="playerModal" class="player-modal">
  <div class="player-container">
    <div class="player-header">
      <span id="currentChannelName">🎬 এখন চলছে</span>
      <button class="close-player" onclick="closePlayer()">✕ বন্ধ করুন</button>
    </div>
    <video id="videoPlayer" class="video-js vjs-default-skin" controls autoplay></video>
  </div>
</div>

<div class="bottom-nav" id="bottomNav">
  <div class="nav-item" data-tab="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
  <div class="nav-item" data-tab="highlights"><i class="fas fa-chart-line"></i><span>Highlights</span></div>
  <div class="nav-item" data-tab="liveevents"><i class="fas fa-broadcast-tower"></i><span>Live Events</span></div>
  <div class="nav-item" data-tab="sports"><i class="fas fa-medal"></i><span>Sports</span></div>
  <div class="nav-item" data-tab="categories"><i class="fas fa-th-large"></i><span>Categories</span></div>
</div>

<script>
  // ========================
  // 🔴 এখানে আপনার চ্যানেলের স্ট্রিম লিংক বসান
  // ========================
  const channelStreams = {
    "T Sports HD": "https://obiramtvlive.pages.dev/?channel=t-sports-hd#player",
    // নিচে আরও চ্যানেল যোগ করুন:
    // "Star Sports 1": "https://example.com/star-sports-1.m3u8",
    // "Sony Ten Cricket": "https://example.com/sony-ten-cricket.m3u8",
  };

  let currentHls = null;
  let currentPlayer = null;

  // চ্যানেল লিস্ট (আপনার আগের মতোই)
  const masterChannels = [
    "FIFA World Cup", "FIFA World Cup Arabic", "BTV NATIONAL HD", "BTV CTG", "T Sports HD", "Peace TV Bangla HD", "TIME TV USA", "CHANNEL I", "NTV", "BANGLA VISION", "RTV", "ATN Bangla", "ETV", "Maasranga Television", "Deepto TV", "GAZI TV", "DESH", "BOSHAKH TV", "CHANNEL 9", "Adian TV", "SA TV", "DURONTO TV", "BANGLA TV", "Ananda TV", "MY TV", "Global TV", "BJUY TV", "NEXUS Television", "MOHONA TV", "DRAMA 24", "SOMOV TV", "CHANNEL 24", "ATN NEWS", "Independent TV", "DBC NEWS", "Ekhon TV", "NEWS 24 BD", "EKATTOR TV", "JAMUNA TV", "MADANI TV", "Toffee Dramas", "Toffee Movies", "Movie Bangla", "Islamic TV",
    "Sky Sports Premier League", "Sky Sports Cricket", "Sky Sports Football", "Sky Sports F1", "Sky Sports News", "Sky Sports Main Event",
    "Sony Sports 1", "Sony Sports 2", "Sony Sports 3", "Sony Ten Cricket", "Sony PIX", "Sony Max",
    "Star Sports 1", "Star Sports 2", "Star Sports 3", "Star Movies HD", "Star Plus HD",
    "CNN", "CNN International", "BBC News", "BBC Earth", "Al Jazeera", "Sky News", "FOX News", "MSNBC", "CNBC", "Bloomberg TV",
    "HBO", "HBO Signature", "HBO Zone", "HBO Max Movies",
    "Disney Channel", "Disney Junior", "Disney XD", "Nickelodeon", "Nick Jr", "Cartoon Network", "PBS Kids", "Discovery Kids",
    "National Geographic", "Discovery Channel", "Animal Planet", "History TV18", "TLC", "Travel Channel",
    "MTV", "VH1", "9XM", "B4U Music", "Zing", "Zoom",
    "ESPN", "Fox Sports", "TNT Sports 1", "TNT Sports 2", "Willow Cricket", "Ten Cricket", "Euro Sports",
    "Zee TV", "Zee Cinema", "Zee News", "Colors", "&TV", "Shemaroo TV",
    "DD National", "DD Sports", "Pogo", "Sony Yay",
    "Euronews", "France 24", "RT News", "CGTN", "TRT World", "NHK World", "WION"
  ];
  
  for (let i = 1; i <= 100; i++) masterChannels.push(`CHANNEL ${i}`);
  
  const logoDatabase = {
    "sky sports": "https://logo.clearbit.com/sky.com",
    "sony": "https://logo.clearbit.com/sony.com",
    "star sports": "https://logo.clearbit.com/star.com",
    "cnn": "https://logo.clearbit.com/cnn.com",
    "bbc": "https://logo.clearbit.com/bbc.com",
    "hbo": "https://logo.clearbit.com/hbo.com",
    "disney": "https://logo.clearbit.com/disney.com",
    "espn": "https://logo.clearbit.com/espn.com",
  };
  
  function getLogoUrl(channelName) {
    const nameLower = channelName.toLowerCase();
    for (const [key, url] of Object.entries(logoDatabase)) {
      if (nameLower.includes(key)) return url;
    }
    return null;
  }
  
  function getInitials(name) { return name.substring(0, 2).toUpperCase(); }
  
  function getGradientColor(name) {
    const colors = ["linear-gradient(135deg, #667eea 0%, #764ba2 100%)", "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)", "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)", "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)"];
    let hash = 0;
    for (let i = 0; i < name.length; i++) { hash = ((hash << 5) - hash) + name.charCodeAt(i); hash |= 0; }
    return colors[Math.abs(hash) % colors.length];
  }
  
  function getChannelCategory(chName) {
    let name = chName.toLowerCase();
    const sports = ["sport", "cricket", "football", "fifa", "tennis", "nfl", "premier league", "la liga", "t20", "willow", "sky sport", "espn", "fox sport", "sony sports", "tnt sport", "star sports", "euro sport"];
    const movies = ["movie", "cinema", "film", "sony pix", "star movies", "hbo", "zee cinema", "bollywood"];
    const news = ["news", "cnn", "bbc", "al jazeera", "sky news", "ndtv", "cnbc", "msnbc", "reuters", "france 24", "bloomberg", "wion", "nhk", "cgtn", "trt"];
    if (sports.some(k => name.includes(k))) return "Sports";
    if (movies.some(k => name.includes(k))) return "Movies";
    if (news.some(k => name.includes(k))) return "News";
    if (name.includes("cartoon") || name.includes("disney") || name.includes("nick")) return "Kids";
    if (name.includes("music") || name.includes("mtv")) return "Music";
    return "Entertainment";
  }
  
  let uniqueMap = new Map();
  masterChannels.forEach(ch => { if (!uniqueMap.has(ch)) uniqueMap.set(ch, { name: ch, category: getChannelCategory(ch), logoUrl: getLogoUrl(ch) }); });
  let channels = Array.from(uniqueMap.values());
  let activeCategory = "All";
  let searchQuery = "";
  
  function openVideoPlayer(streamUrl, channelName) {
    const modal = document.getElementById("playerModal");
    const video = document.getElementById("videoPlayer");
    const titleSpan = document.getElementById("currentChannelName");
    
    if (!streamUrl) {
      alert(`🚫 "${channelName}" এর স্ট্রিম লিংক নেই!`);
      return;
    }
    
    modal.classList.add("active");
    titleSpan.innerHTML = `🎬 ${channelName} - লাইভ`;
    
    if (currentHls) { currentHls.destroy(); currentHls = null; }
    if (currentPlayer) { currentPlayer.pause(); currentPlayer.src = ''; }
    
    if (Hls.isSupported()) {
      currentHls = new Hls();
      currentHls.loadSource(streamUrl);
      currentHls.attachMedia(video);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      currentPlayer = video;
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.play();
      currentPlayer = video;
    } else {
      alert("আপনার ব্রাউজার লাইভ স্ট্রিম সাপোর্ট করে না।");
      modal.classList.remove("active");
    }
  }
  
  function closePlayer() {
    const modal = document.getElementById("playerModal");
    modal.classList.remove("active");
    if (currentHls) { currentHls.destroy(); currentHls = null; }
    if (currentPlayer) { currentPlayer.pause(); currentPlayer.src = ''; }
  }
  
  function renderChannels() {
    let filtered = channels.filter(ch => {
      const matchCat = activeCategory === "All" || ch.category === activeCategory;
      const matchSearch = searchQuery === "" || ch.name.toLowerCase().includes(searchQuery.toLowerCase());
      return matchCat && matchSearch;
    });
    const container = document.getElementById("channelsContainer");
    if (filtered.length === 0) { container.innerHTML = `<div class="empty-msg"><i class="fas fa-tv-slash"></i><br/>No channels found</div>`; return; }
    
    container.innerHTML = filtered.map(ch => {
      const logoHtml = ch.logoUrl ? `<img src="${ch.logoUrl}" onerror="this.parentElement.style.background='${getGradientColor(ch.name)}';this.style.display='none';this.parentElement.innerHTML='${getInitials(ch.name)}'">` : `<span style="background: ${getGradientColor(ch.name)}; width:100%; height:100%; display:flex; align-items:center; justify-content:center; border-radius:14px;">${getInitials(ch.name)}</span>`;
      return `<div class="channel-card" data-channel="${ch.name.replace(/"/g, '&quot;')}"><div class="channel-logo">${logoHtml}</div><div class="channel-info"><h4>${ch.name}</h4><span><i class="fas fa-tag"></i> ${ch.category}</span></div></div>`;
    }).join('');
    
    document.querySelectorAll('.channel-card').forEach(card => {
      card.addEventListener('click', () => {
        const chName = card.getAttribute('data-channel');
        const streamUrl = channelStreams[chName];
        if (streamUrl) {
          openVideoPlayer(streamUrl, chName);
        } else {
          alert(`📺 "${chName}"\n\n❌ স্ট্রিম লিংক যোগ করা হয়নি।\n\n🔧 সমাধান: কোডের channelStreams অবজেক্টে এই চ্যানেলের লিংক যোগ করুন।`);
        }
      });
    });
  }
  
  function renderCategories() {
    const categories = ["All", ...new Set(channels.map(c => c.category))].sort();
    const container = document.getElementById("categoryList");
    container.innerHTML = categories.map(cat => `<div class="category-chip ${activeCategory === cat ? 'active' : ''}" data-cat="${cat}"><i class="fas ${cat === 'All' ? 'fa-globe' : cat === 'Sports' ? 'fa-futbol' : cat === 'Movies' ? 'fa-film' : cat === 'News' ? 'fa-newspaper' : 'fa-tag'}"></i>${cat}</div>`).join('');
    document.querySelectorAll('.category-chip').forEach(chip => { chip.addEventListener('click', () => { activeCategory = chip.getAttribute('data-cat'); renderCategories(); renderChannels(); }); });
  }
  
  function updateHighlight(tab) {
    const banner = document.getElementById("highlightBanner");
    const highlights = {
      highlights: '<div class="highlight-text"><h3><i class="fas fa-fire"></i> 🔥 TOP HIGHLIGHTS</h3><p>FIFA WC Finals · T20 Blast 2025</p></div><div class="live-badge"><i class="fas fa-eye"></i> 15+ Highlights</div>',
      liveevents: '<div class="highlight-text"><h3><i class="fas fa-calendar-week"></i> 🟢 LIVE EVENTS NOW</h3><p>Vitality T20 Blast · LaLiga Live</p></div><div class="live-badge"><i class="fas fa-dot-circle"></i> 8 LIVE MATCHES</div>',
      sports: '<div class="highlight-text"><h3><i class="fas fa-medal"></i> 🏆 SPORTS ZONE</h3><p>Willow Cricket, Star Sports, TNT, Sony Sports</p></div><div class="live-badge"><i class="fas fa-futbol"></i> 24/7 Sports</div>',
      default: '<div class="highlight-text"><h3><i class="fas fa-tv"></i> 🔴 LIVE: FIFA World Cup · T Sports HD</h3><p>Vitality T20 Blast 2025 · Premier League</p></div><div class="live-badge"><i class="fas fa-circle"></i> 12 LIVE EVENTS</div>'
    };
    banner.innerHTML = highlights[tab] || highlights.default;
  }
  
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      item.classList.add('active');
      const tab = item.getAttribute('data-tab');
      if (tab === 'settings') alert("⚙️ Settings: Language, Quality, Favorites");
      else if (tab === 'highlights') { updateHighlight('highlights'); activeCategory = "All"; searchQuery = ""; document.getElementById("searchInput").value = ""; renderCategories(); renderChannels(); }
      else if (tab === 'liveevents') { updateHighlight('liveevents'); activeCategory = "All"; searchQuery = ""; document.getElementById("searchInput").value = ""; renderCategories(); renderChannels(); }
      else if (tab === 'sports') { updateHighlight('sports'); activeCategory = "Sports"; renderCategories(); renderChannels(); }
      else if (tab === 'categories') alert("📺 Categories ব্যবহার করুন উপরের চিপস থেকে!");
    });
  });
  
  document.getElementById("refreshBtn").addEventListener("click", () => {
    searchQuery = ""; activeCategory = "All"; document.getElementById("searchInput").value = ""; renderCategories(); renderChannels(); updateHighlight('default');
    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
  });
  document.getElementById("searchInput").addEventListener("input", (e) => { searchQuery = e.target.value; renderChannels(); });
  document.getElementById("playerModal").addEventListener("click", (e) => { if (e.target === document.getElementById("playerModal")) closePlayer(); });
  
  renderCategories();
  renderChannels();
</script>
</body>
</html>
